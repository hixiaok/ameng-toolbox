<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iris</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <header class="titlebar">
    <span class="tb-title">Iris</span>
    <div class="tb-right"><span class="tb-dot"></span><span class="tb-dot"></span><span class="tb-dot"></span></div>
  </header>

  <div class="body">
    <aside class="side">
      <dl class="devsum">
        <dt>状态</dt><dd id="ds-state">未连接</dd>
        <dt>设备</dt><dd id="ds-code">—</dd>
        <dt>ROOT</dt><dd id="ds-root">—</dd>
        <dt>槽位</dt><dd id="ds-slot">—</dd>
      </dl>
      <nav id="nav"></nav>
      <div class="side-foot"><span>v0.4</span><span id="foot-state">离线</span></div>
    </aside>

    <main class="main" id="main"></main>
  </div>
</div>

<div id="boot-error" class="alert hidden" style="margin:12px 16px"></div>
<script>
  window.addEventListener("error", function (e) {
    var box = document.getElementById("boot-error");
    if (!box) return;
    box.classList.remove("hidden");
    box.textContent = "脚本出错：" + (e.message || e);
  });
</script>
<script>window.__IRIS_TOKEN__ = "__TOKEN__";</script>
<input type="file" id="file" hidden>
<script src="/static/app.js"></script>
</body>
</html>
